<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-label="Ranked horizontal bar chart of ten major proposed U.S. data center energy campuses, comparing announced full-build gigawatt figures as of October 31, 2026."><title>Top 10 U.S. Data Center Energy Megaprojects in 2026</title><desc>Horizontal bars from a zero baseline show reported full-build figures. Fermi 11 gigawatts; Creekstone greater than 10; Stratos about 9; PORTS-Pike 8 gigawatts IT; Nscale Monarch greater than 8 goal; Roswell 6.5; Meta Hyperion 5; Homer City 4.4; Joule Utah 4; Tract Caldwell 4. Capacity types differ and do not represent power operating in 2026.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1b2733}.title{font-size:43px;font-weight:700}.subtitle{font-size:24px;fill:#4d5f70}.rowlabel{font-size:24px;font-weight:600}.value{font-size:22px;font-weight:bold}.axis{font-size:19px;fill:#657687}.note{font-size:20px;fill:#516172}.key{font-size:19px}</style><rect x="0" y="0" width="1600" height="1020" fill="#fff"/><text x="45" y="60" class="title">America's largest data center energy plans</text><text x="45" y="101" class="subtitle">Announced maximum development scale · Gigawatts · Oct. 31, 2026</text><line x1="480" x2="480" y1="172" y2="842" stroke="#dce7ef" stroke-width="1"/><text x="480" y="872" class="axis" text-anchor="middle">0</text>
<line x1="602" x2="602" y1="172" y2="842" stroke="#dce7ef" stroke-width="1"/><text x="602" y="872" class="axis" text-anchor="middle">2</text>
<line x1="724" x2="724" y1="172" y2="842" stroke="#dce7ef" stroke-width="1"/><text x="724" y="872" class="axis" text-anchor="middle">4</text>
<line x1="846" x2="846" y1="172" y2="842" stroke="#dce7ef" stroke-width="1"/><text x="846" y="872" class="axis" text-anchor="middle">6</text>
<line x1="968" x2="968" y1="172" y2="842" stroke="#dce7ef" stroke-width="1"/><text x="968" y="872" class="axis" text-anchor="middle">8</text>
<line x1="1090" x2="1090" y1="172" y2="842" stroke="#dce7ef" stroke-width="1"/><text x="1090" y="872" class="axis" text-anchor="middle">10</text>
<line x1="1212" x2="1212" y1="172" y2="842" stroke="#dce7ef" stroke-width="1"/><text x="1212" y="872" class="axis" text-anchor="middle">12</text><text x="45" y="223" class="rowlabel">1. Project Matador · TX</text><rect x="480" y="195" width="671" height="39" fill="#2672b9" rx="6"/><text x="1166" y="223" class="value">11 GW</text>
<text x="45" y="289" class="rowlabel">2. Delta Gigasite · UT</text><rect x="480" y="261" width="610" height="39" fill="#2672b9" rx="6"/><text x="1105" y="289" class="value">&gt;10 GW</text>
<text x="45" y="355" class="rowlabel">3. Stratos / Wonder Valley · UT</text><rect x="480" y="327" width="549" height="39" fill="#2672b9" rx="6"/><text x="1044" y="355" class="value">~9 GW</text>
<text x="45" y="421" class="rowlabel">4. PORTS-Pike · OH</text><rect x="480" y="393" width="488" height="39" fill="#149a91" rx="6"/><text x="983" y="421" class="value">8 GW IT</text>
<text x="45" y="487" class="rowlabel">5. Nscale Monarch · WV</text><rect x="480" y="459" width="488" height="39" fill="#2672b9" rx="6"/><text x="983" y="487" class="value">&gt;8 GW goal</text>
<text x="45" y="553" class="rowlabel">6. Roswell Information Park · NM</text><rect x="480" y="525" width="397" height="39" fill="#2672b9" rx="6"/><text x="892" y="553" class="value">6.5 GW</text>
<text x="45" y="619" class="rowlabel">7. Meta Hyperion · LA</text><rect x="480" y="591" width="305" height="39" fill="#149a91" rx="6"/><text x="800" y="619" class="value">5 GW compute</text>
<text x="45" y="685" class="rowlabel">8. Homer City · PA</text><rect x="480" y="657" width="268" height="39" fill="#2672b9" rx="6"/><text x="763" y="685" class="value">4.4 GW</text>
<text x="45" y="751" class="rowlabel">9. Joule HPC Campus · UT</text><rect x="480" y="723" width="244" height="39" fill="#2672b9" rx="6"/><text x="739" y="751" class="value">4 GW</text>
<text x="45" y="817" class="rowlabel">10. Tract Caldwell Valley · TX</text><rect x="480" y="789" width="244" height="39" fill="#8064a6" rx="6"/><text x="739" y="817" class="value">4 GW</text><text x="846" y="908" text-anchor="middle" class="axis">Gigawatts (GW), zero-based axis</text><rect x="45" y="920" width="16" height="16" rx="2" fill="#2672b9"/><text x="70" y="934" class="key">Generation / power plan</text><rect x="376" y="920" width="16" height="16" rx="2" fill="#149a91"/><text x="401" y="934" class="key">IT / compute</text><rect x="614" y="920" width="16" height="16" rx="2" fill="#8064a6"/><text x="639" y="934" class="key">Site potential</text><text x="45" y="970" class="note">Caution: these are mixed disclosed measures, not comparable operating load or committed capacity.</text><text x="45" y="997" class="note">“&gt;10” is plotted at a 10 GW floor; ~9 includes a 7.5 GW detailed gas proposal. Source: state reports + cited developer filings.</text></svg>